	<html lang="zh">

	    <style>

	            box-sizing: border-box; margin: 0; padding: 0;
	            -webkit-tap-highlight-color: transparent;
	        }
	        body {
	            background: #f0f0f0; min-height: 100vh; display: flex;

	        }

	        .theme-anime {

	        .theme-anime .city-input { background: rgba(255,255,255,0.8); border: 2px solid #0288d1; color: #01579b; padding: 2px 4px; border-radius: 4px; flex: 1; min-width: 0; font-size: 11px; font-weight: bold; }

	        .theme-anime .collection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 16px; }

	        .theme-anime .collect-name { font-size: 10px; color: #33691e; text-align: center; font-weight: bold; background: rgba(255,255,255,0.6); padding: 1px 3px; border-radius: 2px; }

	        .theme-anime .nav-item.active { background: #ff8f00; color: #fff; }

	<body>
	<div class="game-wrapper theme-anime" id="gameWrapper">
	    <button class="theme-toggle" id="themeToggle">二档</button>
	    <div class="broadcast-bar" id="broadcastBar">
	        <span class="broadcast-icon" id="broadcastIcon">🏴‍☠️</span>
	        <span class="broadcast-text" id="broadcastText">点击获取海贼广播</span>
	    </div>
	    <div class="top-bar">
	        <div class="status-box">
	            <input type="text" id="cityInput" class="city-input" placeholder="输入地名" value="风车村">
	            <button class="random-btn" id="randomLocBtn">🎲</button>
	        </div>
	        <div class="status-box">
	            <span id="weekday">三</span>&nbsp;<span id="timeDisplay">15:01</span>&nbsp;฿<span id="bountyAmount">0</span>
	        </div>
	    </div>
	    <div id="homePage" class="page active-page">
	        <div class="npc-area">
	            <div class="npc-avatar" id="npcAvatar">🏴‍☠️</div>
	            <div class="npc-dialogue" id="npcDialogue">点击海贼旗切换伙伴</div>
	        </div>
	        <div class="resources">
	            <div class="res-item">⚡磁力: <span id="homeEnergy">0</span></div>
	            <div class="res-item">📖日志: <span id="homeAlloy">0</span>/80</div>
	        </div>
	        <div class="story-card">
	            <div class="story-title">当前悬赏金</div>
	            <div class="story-text" style="font-size: 24px; font-family: 'Press Start 2P'; color: #e65100;">฿ <span id="homeBountyAmount">0</span></div>
	        </div>
	    </div>
	    <div id="sportPage" class="page">
	        <div class="motion-grid">
	            <div class="motion-btn selected" data-type="squat">🧗深蹲</div>
	            <div class="motion-btn" data-type="punch">🥊挥拳</div>
	            <div class="motion-btn" data-type="walk">🚶散步</div>
	        </div>
	        <div class="timer-panel">
	            <div class="timer-digits" id="timerDisplay">00:00</div>
	            <div class="step-counter">动作次数: <span id="stepCount">0</span></div>
	        </div>
	        <div class="feedback" id="feedbackMsg">选择模式开始修炼</div>
	        <div class="control-row">
	            <div class="btn" id="startBtn">▶ 开始</div>
	            <div class="btn" id="stopBtn">■ 结束</div>
	        </div>
	    </div>
	    <div id="storyPage" class="page">
	        <div class="story-card">
	            <div class="story-title">第 <span id="storyChapter">1</span>/80 站</div>
	            <div class="story-text" id="storyText">一切始于风车村...</div>
	        </div>
	        <div class="btn" id="advanceStoryBtn" style="width:100%; text-align:center;">推进记录指针</div>
	    </div>
	    <div id="collectionPage" class="page">
	        <div class="collection-grid" id="collectionGrid"></div>
	    </div>
	    <div class="nav-bar" style="margin-top: 16px;">
	        <span class="nav-item active" data-page="home">🚢<div>甲板</div></span>
	        <span class="nav-item" data-page="sport">🥊<div>修炼</div></span>
	        <span class="nav-item" data-page="story">🧭<div>航海</div></span>
	        <span class="nav-item" data-page="collection">💰<div>悬赏</div></span>
	    </div>
	</div>
	<div class="modal-overlay" id="resultModal">
	    <div class="modal-content">
	        <h2 id="resultTitle">修炼结束</h2>
	        <p id="resultTime">用时：00:00</p>
	        <p id="resultAction">动作次数：0 次</p>
	        <div class="reward" id="resultReward">获得磁力：0 ⚡</div>
	        <button class="modal-btn" onclick="closeModal()">继续航行</button>
	    </div>
	</div>
	<script>
	    (function() {
	        let energy = parseInt(localStorage.getItem('op_energy')) || 100;
	        let storyNode = parseInt(localStorage.getItem('op_storyNode')) || 1;
	        let collected = JSON.parse(localStorage.getItem('op_collected')) || [];
	        let currentType = 'squat';
	        let timerInterval = null, seconds = 0, isRunning = false, stepCount = 0;
	        let lastAccel = {x:0, y:0, z:0}, lastPeakTime = 0;
	        let todayDate = new Date().toDateString();
	        let walkDate = localStorage.getItem('op_walkDate');
	        let walkEnergyToday = parseInt(localStorage.getItem('op_walkEnergy')) || 0;
	        if (walkDate !== todayDate) {
	            walkEnergyToday = 0; localStorage.setItem('op_walkDate', todayDate); localStorage.setItem('op_walkEnergy', 0);
	        }
	        const opLocations = ['风车村', '谢尔兹镇', '橘子镇', '西罗布村', '巴拉蒂', '可可亚西村', '罗格镇', '颠倒山', '双子岬', '威士忌山峰', '小花园', '磁鼓岛', '阿拉巴斯坦', '加雅岛', '空岛', '长环岛', '水之七岛', '司法岛', '恐怖三桅帆船', '香波地群岛', '女儿岛', '推进城', '马林梵多', '鱼人岛', '庞克哈萨德', '德雷斯罗萨', '佐乌', '蛋糕岛', '和之国'];
	        const broadcastLib = [
	            { icon: '🧭', text: '世代传承的意志，时代的变迁，人的梦想...' },

	            homeAlloy.innerText = collected.length;
	            let currentBounty = storyNode > 1 ? stories[storyNode - 2].bounty : 0;
	            bountyAmount.innerText = currentBounty.toLocaleString();
	            homeBountyAmount.innerText = currentBounty.toLocaleString();
	            localStorage.setItem('op_energy', energy);
	        }
	        function formatTime(sec) {
	            let m = Math.floor(sec / 60).toString().padStart(2,'0');
	            let s = (sec % 60).toString().padStart(2,'0');
	            return m+':'+s;
	        }
	        function updateTimerUI() { timerDisplay.innerText = formatTime(seconds); }
	        document.querySelectorAll('.motion-btn').forEach(btn => {
	            btn.addEventListener('click', function() {
	                if (isRunning) return;
	                beep(440);
	                document.querySelectorAll('.motion-btn').forEach(b => b.classList.remove('selected'));
	                this.classList.add('selected');
	                currentType = this.dataset.type;
	            });
	        });
	        function handleMotion(e) {
	            if (!isRunning) return;
	            let acc = e.accelerationIncludingGravity;
	            if (!acc) return;
	            let deltaX = Math.abs(acc.x - lastAccel.x), deltaY = Math.abs(acc.y - lastAccel.y), deltaZ = Math.abs(acc.z - lastAccel.z);
	            lastAccel = {x:acc.x, y:acc.y, z:acc.z};
	            let now = Date.now(), isPeak = false;
	            if (currentType === 'squat' && deltaZ > 8) isPeak = true; 
	            else if (currentType === 'punch' && (deltaX > 10 || deltaY > 10) && deltaZ < 8) isPeak = true;
	            if (isPeak && (now - lastPeakTime > 600)) {
	                lastPeakTime = now; stepCount++; energy += 5; updateResources();
	                stepCountSpan.innerText = stepCount;
	                feedbackMsg.innerText = `动作达标! +5 ⚡`; beep(1200);
	            }
	        }
	        $('startBtn').addEventListener('click', function() {
	            if (currentType === 'walk') { handleWalkInput(); return; }
	            if (isRunning) return; 
	            if (typeof DeviceMotionEvent.requestPermission === 'function') {
	                DeviceMotionEvent.requestPermission().then(state => {
	                    if (state === 'granted') { window.addEventListener('devicemotion', handleMotion); startTimer(); }
	                    else { feedbackMsg.innerText = '需开启运动权限才能计分'; }
	                }).catch(console.error);
	            } else {
	                if (window.DeviceMotionEvent) window.addEventListener('devicemotion', handleMotion);
	                startTimer();
	            }
	        });
	        function startTimer() {
	            beep(660); isRunning = true; seconds = 0; stepCount = 0;
	            updateTimerUI(); stepCountSpan.innerText = stepCount;
	            feedbackMsg.innerText = '修炼开始！';
	            document.querySelectorAll('.motion-btn').forEach(b => { if(!b.classList.contains('selected')) b.classList.add('locked'); });
	            timerInterval = setInterval(() => {
	                if (!isRunning) return; seconds++; updateTimerUI();
	                if (seconds % 60 === 0) { energy += 1; updateResources(); feedbackMsg.innerText = "坚持修炼奖励! +1 ⚡"; }
	            }, 1000);
	        }
	        $('stopBtn').addEventListener('click', () => {
	            if (!isRunning) return; beep(330); isRunning = false;
	            clearInterval(timerInterval); window.removeEventListener('devicemotion', handleMotion);
	            document.querySelectorAll('.motion-btn').forEach(b => b.classList.remove('locked'));
	            let totalReward = Math.floor(seconds / 60) + stepCount * 5;
	            $('resultTime').innerText = `用时：${formatTime(seconds)}`;
	            $('resultAction').innerText = `动作次数：${stepCount} 次`;
	            $('resultReward').innerText = `获得磁力：+${totalReward} ⚡`;
	            $('resultModal').style.display = 'flex';
	            feedbackMsg.innerText = `修炼结束！共获得 ${totalReward} ⚡`;
	        });
	        function handleWalkInput() {
	            let remaining = 500 - walkEnergyToday;
	            if (remaining <= 0) { alert("今日散步磁力已刷满(500⚡)！"); return; }
	            let input = prompt(`请输入刚才散步的步数：\n(汇率：10步=1⚡)\n今日剩余可兑换：${remaining}⚡`, "");
	            if (input === null) return;
	            let steps = parseInt(input);
	            if (isNaN(steps) || steps <= 0) { alert("请输入正确的步数数字！"); return; }
	            let gainedEnergy = Math.floor(steps / 10);
	            if (gainedEnergy > remaining) { gainedEnergy = remaining; alert(`已达今日上限。本次实际兑换：${gainedEnergy}⚡`); }
	            energy += gainedEnergy; walkEnergyToday += gainedEnergy;
	            localStorage.setItem('op_walkEnergy', walkEnergyToday); updateResources();
	            $('resultTime').innerText = `输入步数：${steps} 步`;
	            $('resultAction').innerText = `汇率折算：10步 = 1⚡`;
	            $('resultReward').innerText = `获得磁力：+${gainedEnergy} ⚡\n(今日剩余：${500 - walkEnergyToday}⚡)`;
	            $('resultModal').style.display = 'flex';
	        }
	        window.closeModal = () => $('resultModal').style.display = 'none';
	        function updateStoryUI() {
	            storyChapter.innerText = storyNode;
	            let idx = storyNode - 1;
	            if (idx >= 0 && idx < stories.length) {
	                storyText.innerText = stories[idx].text;
	                advanceBtn.innerText = storyNode >= stories.length ? "已到达空岛终点" : `推进记录指针 (消耗 ${stories[idx].cost}⚡)`;
	            }
	        }
	        advanceBtn.addEventListener('click', ()=>{
	            beep(); if (storyNode >= stories.length) return;
	            let cost = stories[storyNode - 1].cost;
	            if (energy >= cost) {
	                energy -= cost; storyNode++;
	                let idx = storyNode - 2;
	                if (!collected.includes(idx)) {
	                    collected.push(idx);
	                    localStorage.setItem('op_collected', JSON.stringify(collected));
	                    renderCollection();
	                    alert(`航海日志解锁！\n${stories[idx].vol}\n悬赏金提升至：฿${stories[idx].bounty.toLocaleString()}`);
	                }
	                localStorage.setItem('op_storyNode', storyNode);
	                updateResources(); updateStoryUI();
	            } else { alert(`磁力不足！还需 ${cost - energy} ⚡`); }
	        });
	        function applySeasonAndNight() {
	            const now = new Date(); const hour = now.getHours();
	            $('timeDisplay').innerText = hour.toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
	            const weekdays = ['日','一','二','三','四','五','六'];
	            $('weekday').innerText = weekdays[now.getDay()];
	        }
	        document.querySelectorAll('.nav-item').forEach(item => {
	            item.addEventListener('click', function() {
	                beep(550);
	                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
	                this.classList.add('active');
	                document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
	                $(this.dataset.page + 'Page').classList.add('active-page');
	            });
	        });
	        $('themeToggle').addEventListener('click', () => {
	            beep(770);
	            if (gameWrapper.classList.contains('theme-anime')) {
	                gameWrapper.classList.remove('theme-anime'); gameWrapper.classList.add('theme-manga');
	                $('themeToggle').innerText = '一档';
	            } else {
	                gameWrapper.classList.remove('theme-manga'); gameWrapper.classList.add('theme-anime');
	                $('themeToggle').innerText = '二档';
	            }
	        });
	        $('randomLocBtn').addEventListener('click', function() {
	            beep(550);
	            let r = Math.floor(Math.random() * opLocations.length);
	            $('cityInput').value = opLocations[r];
	        });
	        init();
	    })();
	</script>
	</body>
	</html>
